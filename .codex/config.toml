# Проектные настройки Codex для мозга агента-сисадмина (ADR-0042).
# Загружаются, только если проект помечен доверенным в ~/.codex/config.toml:
#   [projects."<путь к sysadmin>"]
#   trust_level = "trusted"
# Замки — в соседнем .codex/hooks.json (их нужно одобрить один раз командой /hooks).

# Ядро AGENTS.md (~51 КБ) больше предела Codex по умолчанию (32 КиБ). Ключ действует и
# здесь, и в ~/.codex/config.toml; ставим в обоих, потому что глобальный ~/.codex/AGENTS.md
# читается в тот же бюджет.
project_doc_max_bytes = 98304

[features]
# Замки красной зоны, общей рабочей копии, гейт /retro и сторож inventory.
hooks = true
